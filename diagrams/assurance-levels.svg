<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">What each assurance level asks for</text>
<text x="32" y="103.8" font-size="15" fill="#566070">Each level includes everything below it. Drivers are built at high; safety is chosen per component.</text>
