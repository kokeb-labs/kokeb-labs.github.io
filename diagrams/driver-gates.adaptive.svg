<text x="32" y="77.3" font-size="26" font-weight="700" class="fk-f-ink">What stands between a datasheet and a release candidate</text>
<text x="32" y="103.8" font-size="15" class="fk-f-muted">Every public driver goes through these stages. The checks in the second column run on every pull request.</text>
