<text x="48" y="162.8" font-size="13" font-weight="700" fill="#E2E8F0">INPUTS</text>
<text x="342" y="162.8" font-size="13" font-weight="700" fill="#BFDBFE">CI</text>
<text x="636" y="162.8" font-size="13" font-weight="700" fill="#FDE68A">REVIEW</text>
<text x="930" y="162.8" font-size="13" font-weight="700" fill="#BBF7D0">RELEASE</text>
<text x="64" y="217.6" font-size="15" font-weight="700" fill="#E8EDF3">Public datasheet</text>
<text x="64" y="242.4" font-size="13" fill="#D2DAE4">no NDA, no login</text>
<text x="64" y="302.6" font-size="15" font-weight="700" fill="#E8EDF3">Chip model</text>
<text x="64" y="327.4" font-size="13" fill="#D2DAE4">written from the</text>
<text x="64" y="346.2" font-size="13" fill="#D2DAE4">datasheet, not from the</text>
<text x="64" y="365.1" font-size="13" fill="#D2DAE4">driver</text>
<text x="358" y="217.6" font-size="15" font-weight="700" fill="#E8EDF3">Host tests</text>
<text x="358" y="242.4" font-size="13" fill="#D2DAE4">error paths forced,</text>
<text x="358" y="261.2" font-size="13" fill="#D2DAE4">compile-fail cases</text>
<text x="358" y="321.6" font-size="15" font-weight="700" fill="#E8EDF3">Sanitizers and</text>
<text x="358" y="341.1" font-size="15" font-weight="700" fill="#E8EDF3">fuzzing</text>
<text x="358" y="365.9" font-size="13" fill="#D2DAE4">corrupted replies, resets</text>
<text x="358" y="384.8" font-size="13" fill="#D2DAE4">at any point</text>
<text x="358" y="444.6" font-size="15" font-weight="700" fill="#E8EDF3">Coverage and</text>
<text x="358" y="464.1" font-size="15" font-weight="700" fill="#E8EDF3">complexity</text>
<text x="358" y="488.9" font-size="13" fill="#D2DAE4">85 % lines, 75 %</text>
<text x="358" y="507.8" font-size="13" fill="#D2DAE4">branches</text>
<text x="358" y="567.5" font-size="15" font-weight="700" fill="#E8EDF3">MISRA C++:2023</text>
<text x="358" y="587" font-size="15" font-weight="700" fill="#E8EDF3">scan</text>
<text x="358" y="611.9" font-size="13" fill="#D2DAE4">with the C++20 profile</text>
<text x="652" y="217.6" font-size="15" font-weight="700" fill="#E8EDF3">Independent review</text>
<text x="652" y="237.1" font-size="15" font-weight="700" fill="#E8EDF3">rounds</text>
<text x="652" y="261.9" font-size="13" fill="#D2DAE4">reviewer did not write the</text>
<text x="652" y="280.8" font-size="13" fill="#D2DAE4">code</text>
<text x="652" y="340.6" font-size="15" font-weight="700" fill="#E8EDF3">Mutants of every fix</text>
<text x="652" y="365.4" font-size="13" fill="#D2DAE4">a test must fail on each</text>
<text x="946" y="217.6" font-size="15" font-weight="700" fill="#E8EDF3">Release candidate</text>
<text x="946" y="242.4" font-size="13" fill="#D2DAE4">tag vX.Y.Z-rc.N</text>
<text x="946" y="261.2" font-size="13" fill="#D2DAE4">docs published under the</text>
<text x="946" y="280.1" font-size="13" fill="#D2DAE4">tag</text>
<text x="946" y="298.9" font-size="13" fill="#D2DAE4">hardware level stated</text>
</svg>
