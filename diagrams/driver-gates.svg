<svg xmlns="http://www.w3.org/2000/svg" width="1176" height="679" viewBox="0 0 1176 679" role="img" aria-labelledby="driver-gates-title driver-gates-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="driver-gates-title">What stands between a datasheet and a release candidate</title>
<desc id="driver-gates-desc">Pipeline in four columns in which a public datasheet and an independent chip model feed the CI checks, an independent review round follows, and a release candidate with a stated hardware level comes out.</desc>
<defs><marker id="driver-gates-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C8798"/></marker></defs>
<rect x="0.5" y="0.5" width="1175" height="678" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">KOKEB LABS</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">What stands between a datasheet and a release candidate</text>
<text x="32" y="103.8" font-size="15" fill="#566070">Every public driver goes through these stages. The checks in the second column run on every pull request.</text>
<rect x="32" y="119.8" width="1112" height="1" fill="#E2E7EE"/>
