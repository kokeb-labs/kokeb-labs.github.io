<text x="56" y="184.4" font-size="20" font-weight="700" fill="#A7F3E6">Your firmware</text>
<text x="56" y="215" font-size="17" fill="#D2DAE4">a product, a board or a test bench</text>
<text x="862" y="184.4" font-size="20" font-weight="700" fill="#E8EDF3">Open boards</text>
<text x="862" y="215" font-size="17" fill="#D2DAE4">KiCad boards built around the</text>
<text x="862" y="239.7" font-size="17" fill="#D2DAE4">drivers; your firmware runs on</text>
<text x="862" y="264.4" font-size="17" fill="#D2DAE4">them</text>
<rect x="1096.3" y="163.4" width="57.7" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="1104.3" y="181.5" font-size="16" font-weight="700" fill="#F8D27A">early</text>
<text x="56" y="337.4" font-size="20" font-weight="700" fill="#E8EDF3">kb-core</text>
<text x="56" y="368" font-size="17" fill="#D2DAE4">handlers, interfaces, RTOS wrappers, utilities</text>
<rect x="693" y="316.4" width="83" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="701" y="334.5" font-size="16" font-weight="700" fill="#F8D27A">planned</text>
<text x="56" y="490.4" font-size="20" font-weight="700" fill="#E8EDF3">Chip drivers</text>
<text x="56" y="521" font-size="17" fill="#D2DAE4">driver-&lt;chip&gt;: one per chip, no SDK calls</text>
<rect x="693" y="469.4" width="83" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="701" y="487.5" font-size="16" font-weight="700" fill="#F8D27A">planned</text>
<text x="56" y="643.4" font-size="20" font-weight="700" fill="#A7F3E6">MCU port</text>
<text x="56" y="674" font-size="17" fill="#D2DAE4">transfer, GPIO and delay: yours, or a ready one in kb-core</text>
<text x="56" y="796.4" font-size="20" font-weight="700" fill="#E2E8F0">The chip, on your board</text>
<text x="56" y="827" font-size="17" fill="#D2DAE4">SPI, I2C or UART</text>
