<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">From your firmware to the chip</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">Each arrow is a call. Everything above the port runs on any MCU and on a laptop.</text>
