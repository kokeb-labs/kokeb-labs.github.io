<text x="411" y="735.2" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">bus transfers</text>
<text x="878" y="382.4" font-size="20" font-weight="700" fill="#F8D27A">driver-template</text>
<text x="878" y="413" font-size="17" fill="#D2DAE4">starts a driver</text>
