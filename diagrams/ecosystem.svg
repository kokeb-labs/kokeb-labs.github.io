<text x="56" y="674" font-size="17" fill="#2B3442">transfer, GPIO and delay: yours, or a ready one in kb-core</text>
<text x="56" y="796.4" font-size="20" font-weight="700" fill="#334155">The chip, on your board</text>
<text x="56" y="827" font-size="17" fill="#2B3442">SPI, I2C or UART</text>
