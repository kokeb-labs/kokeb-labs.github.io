<text x="56" y="184.4" font-size="20" font-weight="700" fill="#0B5F59">Your firmware</text>
<text x="56" y="215" font-size="17" fill="#2B3442">a product, a board or a test bench</text>
<text x="56" y="337.4" font-size="20" font-weight="700" fill="#0E1726">kb-core</text>
<text x="56" y="368" font-size="17" fill="#2B3442">handlers, interfaces, RTOS wrappers, utilities</text>
<rect x="693" y="316.4" width="83" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="701" y="334.5" font-size="16" font-weight="700" fill="#7A360E">planned</text>
