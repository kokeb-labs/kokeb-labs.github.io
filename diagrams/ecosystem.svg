<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="913" viewBox="0 0 1200 913" role="img" aria-labelledby="ecosystem-title ecosystem-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="ecosystem-title">From your firmware to the chip</title>
<desc id="ecosystem-desc">Layer diagram: your firmware calls kb-core, which calls brand-free chip drivers, which reach the hardware only through an MCU port; driver-template, espidf-tools and ci-tools start, build and check every repository.</desc>
<defs><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8893A2"/></marker></defs>
