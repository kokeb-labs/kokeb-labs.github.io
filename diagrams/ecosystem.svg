<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#7A360E">KOKEB LABS</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#0E1726">From your firmware to the chip</text>
<text x="32" y="115.4" font-size="18" fill="#566070">Each arrow is a call. Everything above the port runs on any MCU and on a laptop.</text>
