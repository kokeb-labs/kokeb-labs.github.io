<text x="323" y="356.1" font-size="15" font-weight="700" text-anchor="middle" fill="#BFDBFE">H1</text>
<text x="323" y="454.1" font-size="15" font-weight="700" text-anchor="middle" fill="#BBF7D0">H2</text>
<rect x="328.1" y="194.6" width="76.7" height="20" rx="10" fill="#0E131A"/>
<text x="366.5" y="208.9" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">new driver</text>
<rect x="328.1" y="292.6" width="240.7" height="20" rx="10" fill="#0E131A"/>
