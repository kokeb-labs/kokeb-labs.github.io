<path d="M320 381.6 L320 419.6" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hardware-levels-arrow-rail)"/>
<rect x="245" y="227.6" width="150" height="52" rx="10" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<rect x="245" y="235.6" width="4" height="36" rx="2" fill="#94A3B8"/>
<rect x="245" y="325.6" width="150" height="52" rx="10" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<rect x="245" y="333.6" width="4" height="36" rx="2" fill="#60A5FA"/>
<rect x="245" y="423.6" width="150" height="52" rx="10" fill="#11281A" stroke="#4ADE80" stroke-width="1.4"/>
