<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">One measurement through a driver</text>
<text x="32" y="103.8" font-size="15" fill="#566070">Your firmware, the driver, your port and the chip. Only the port knows about your</text>
<text x="32" y="125.5" font-size="15" fill="#566070">MCU.</text>
