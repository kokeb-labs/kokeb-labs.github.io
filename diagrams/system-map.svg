<text x="56" y="184.4" font-size="20" font-weight="700" fill="#0B5F59">Your firmware</text>
<text x="56" y="215" font-size="17" fill="#2B3442">a product, a board or a test bench</text>
<text x="852" y="184.4" font-size="20" font-weight="700" fill="#0E1726">Open boards</text>
<text x="852" y="215" font-size="17" fill="#2B3442">KiCad boards built around the</text>
<text x="852" y="239.7" font-size="17" fill="#2B3442">drivers, for your firmware to run</text>
<text x="852" y="264.4" font-size="17" fill="#2B3442">on; concept stage</text>
<rect x="1096.3" y="163.4" width="57.7" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="1104.3" y="181.5" font-size="16" font-weight="700" fill="#7A360E">early</text>
<text x="56" y="337.4" font-size="20" font-weight="700" fill="#0E1726">kb-core</text>
<text x="56" y="368" font-size="17" fill="#2B3442">framework with handlers, interfaces and RTOS wrappers</text>
<rect x="471.7" y="316.4" width="144.3" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="479.7" y="334.5" font-size="16" font-weight="700" fill="#7A360E">in development</text>
<text x="56" y="490.4" font-size="20" font-weight="700" fill="#7A360E">Chip drivers</text>
<text x="56" y="521" font-size="17" fill="#2B3442">driver-&lt;chip&gt;: 22 public, release candidate 0.1.0-rc.1; no SDK calls</text>
<text x="56" y="643.4" font-size="20" font-weight="700" fill="#0B5F59">MCU port</text>
<text x="56" y="674" font-size="17" fill="#2B3442">transfer, GPIO and delay hooks: a class you write, or an ESP32 or STM32 port (in</text>
<text x="56" y="698.7" font-size="17" fill="#2B3442">development)</text>
<text x="56" y="821.4" font-size="20" font-weight="700" fill="#334155">The chip, on your board</text>
<text x="56" y="852" font-size="17" fill="#2B3442">SPI, I2C, UART, ADC or another bus</text>
<rect x="243" y="258.4" width="49.1" height="24" rx="12" fill="#FFFFFF"/>
<text x="267.6" y="276.2" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">calls</text>
<rect x="243" y="411.4" width="49.1" height="24" rx="12" fill="#FFFFFF"/>
<text x="267.6" y="429.2" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">calls</text>
