<title id="system-map-title">How Kokeb Labs fits together</title>
<desc id="system-map-desc">System map: your firmware calls chip drivers, directly or through kb-core when it is released; a driver reaches the chip only through an MCU port; beside this path, the templates, ci-tools, the handbook and driver-requests start, check and release every repository.</desc>
