<text x="720" y="344.7" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">directly, today</text>
<rect x="329.4" y="564.4" width="153.2" height="24" rx="12" fill="#FFFFFF"/>
<text x="406" y="582.2" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">through its hooks</text>
<rect x="346.1" y="742.4" width="119.7" height="24" rx="12" fill="#FFFFFF"/>
<text x="406" y="760.2" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">bus transfers</text>
<text x="868" y="382.4" font-size="20" font-weight="700" fill="#7A360E">driver-template</text>
<text x="868" y="413" font-size="17" fill="#2B3442">starts a driver</text>
<text x="868" y="483.4" font-size="20" font-weight="700" fill="#7A360E">board-template</text>
<text x="868" y="514" font-size="17" fill="#2B3442">starts a board</text>
