<text x="868" y="615" font-size="17" fill="#2B3442">checks, documents, releases</text>
<text x="868" y="685.4" font-size="20" font-weight="700" fill="#7A360E">handbook</text>
<text x="868" y="716" font-size="17" fill="#2B3442">the rules the checks enforce</text>
<text x="868" y="786.4" font-size="20" font-weight="700" fill="#7A360E">espidf-tools</text>
<text x="868" y="817" font-size="17" fill="#2B3442">builds and flashes ESP-IDF</text>
<text x="868" y="841.7" font-size="17" fill="#2B3442">apps</text>
