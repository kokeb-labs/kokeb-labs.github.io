<text x="323" y="258.1" font-size="15" font-weight="700" text-anchor="middle" class="fk-f-slate-text">H0</text>
<text x="323" y="356.1" font-size="15" font-weight="700" text-anchor="middle" class="fk-f-blue-text">H1</text>
<text x="323" y="454.1" font-size="15" font-weight="700" text-anchor="middle" class="fk-f-green-text">H2</text>
