<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">KOKEB LABS</text>
<text x="32" y="77.3" font-size="26" font-weight="700" class="fk-f-ink">Hardware validation levels</text>
<text x="32" y="103.8" font-size="15" class="fk-f-muted">A driver states how far it has been checked on real hardware. A new driver</text>
<text x="32" y="125.5" font-size="15" class="fk-f-muted">starts at H0.</text>
