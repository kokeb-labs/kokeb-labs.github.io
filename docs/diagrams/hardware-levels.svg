<svg xmlns="http://www.w3.org/2000/svg" width="640" height="506" viewBox="0 0 640 506" role="img" aria-labelledby="hardware-levels-title hardware-levels-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="hardware-levels-title">Hardware validation levels</title>
<desc id="hardware-levels-desc">State machine of the three hardware validation levels H0, H1 and H2, from a host model only, to a bench rig run with logs kept, to a hardware engineer's sign-off.</desc>
<defs><marker id="hardware-levels-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C8798"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="505" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">KOKEB LABS</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">Hardware validation levels</text>
<text x="32" y="103.8" font-size="15" fill="#566070">A driver states how far it has been checked on real hardware. A new driver</text>
<text x="32" y="125.5" font-size="15" fill="#566070">starts at H0.</text>
<rect x="32" y="141.6" width="576" height="1" fill="#E2E7EE"/>
<path d="M320 185.6 L320 223.6" fill="none" stroke="#7C8798" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hardware-levels-arrow-rail)"/>
