<path d="M320 381.6 L320 419.6" fill="none" stroke="#7C8798" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hardware-levels-arrow-rail)"/>
<rect x="245" y="227.6" width="150" height="52" rx="10" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<rect x="245" y="235.6" width="4" height="36" rx="2" fill="#64748B"/>
<rect x="245" y="325.6" width="150" height="52" rx="10" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="245" y="333.6" width="4" height="36" rx="2" fill="#2563EB"/>
<rect x="245" y="423.6" width="150" height="52" rx="10" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/>
<rect x="245" y="431.6" width="4" height="36" rx="2" fill="#15803D"/>
<circle cx="320" cy="170.6" r="11" fill="#2B3442"/>
<text x="323" y="258.1" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">H0</text>
<text x="323" y="356.1" font-size="15" font-weight="700" text-anchor="middle" fill="#1E429F">H1</text>
<text x="323" y="454.1" font-size="15" font-weight="700" text-anchor="middle" fill="#14532D">H2</text>
<rect x="328.1" y="194.6" width="76.7" height="20" rx="10" fill="#FFFFFF"/>
<text x="366.5" y="208.9" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">new driver</text>
<rect x="328.1" y="292.6" width="240.7" height="20" rx="10" fill="#FFFFFF"/>
<text x="448.5" y="306.9" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">bench rig runs the example, logs kept</text>
<rect x="327.8" y="390.6" width="183.5" height="20" rx="10" fill="#FFFFFF"/>
<text x="419.5" y="404.9" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">hardware engineer signs off</text>
