<svg xmlns="http://www.w3.org/2000/svg" width="720" height="785" viewBox="0 0 720 785" role="img" aria-labelledby="one-measurement-title one-measurement-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="one-measurement-title">One measurement through a driver</title>
<desc id="one-measurement-desc">Sequence of a driver start and one measurement, in which the firmware starts the driver, the driver checks the chip through the port and returns a result, and a later call returns a value or an error code.</desc>
