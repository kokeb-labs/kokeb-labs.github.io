kind: matrix
id: assurance-levels
title: What each assurance level asks for
kicker: Kokeb Labs
subtitle: Each level includes everything below it. Drivers are built at high; safety is chosen per component.
alt: >-
  Matrix of the checks and evidence asked for at the standard, high and safety assurance levels, from
  lint and host tests for every repository to a signed evidence package at safety.
reads: >-
  Rows are the checks and evidence. Columns are the three assurance levels standard, high and safety. A cell says
  required, measured or not required in words and with a mark. Format, lint, static analysis, host tests, the strict
  documentation build, the sign-off check and the CI gate are required at every level. Sanitizers, a coverage floor,
  builds for every supported target, warning-free Doxygen on the public API and a deviation record for every suppressed
  finding start at high. Requirement traceability, full branch and MC/DC coverage, the coding-standard matrix with a
  commercial MISRA checker, an anomaly list and a signed evidence package start at safety.
