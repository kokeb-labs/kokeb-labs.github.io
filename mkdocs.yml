---
# The Kokeb Labs portal, https://kokeb-labs.github.io/: one unversioned site on the Kokeb Labs MkDocs platform.
# Preview locally:
#
#   pip install "git+https://github.com/kokeb-labs/ci-tools@v1\
#   #subdirectory=packages/kokeb-mkdocs-theme"      (one line, without the backslash)
#   mkdocs serve                                     http://127.0.0.1:8000
#   kokeb-docs figures                               refresh the figures
#
# Pages: docs/, order: docs/.nav.yml, rules: docs/DOCS-STYLE-GUIDE.md in ci-tools.
site_name: Kokeb Labs
site_description: >-
  Open, brand-free drivers, firmware building blocks and tools for embedded systems.
repo_url: https://github.com/kokeb-labs/kokeb-labs.github.io

# The figure index is linked from each figure's caption, not from the tabs.
not_in_nav: |
  /diagrams/index.md

theme:
  name: kokeb

plugins:
  - kokeb
  - search
  - awesome-nav
